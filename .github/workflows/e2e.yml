name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: renyqo_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d renyqo_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/renyqo_e2e
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/renyqo_e2e
      E2E_DATABASE_ALLOW_RESET: 'true'
      SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
      FRONTEND_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:e2e -- --runInBand
