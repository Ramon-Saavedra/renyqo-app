name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-shards:
    name: e2e-shard (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: renyqo_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d renyqo_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/renyqo_e2e
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/renyqo_e2e
      E2E_DATABASE_ALLOW_RESET: 'true'
      SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
      FRONTEND_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit
      - run: npx prisma generate
      - name: Check shard verification helper
        run: |
          npx eslint scripts/e2e-shards.cjs scripts/e2e-shards.test.cjs
          node --test scripts/e2e-shards.test.cjs
      - name: Verify complete, disjoint shard discovery
        id: discovery
        run: node scripts/e2e-shards.cjs discover "$RUNNER_TEMP/e2e-discovery.json"
      - run: npx prisma migrate deploy
      - name: Run E2E shard
        id: tests
        run: >-
          npm run test:e2e -- --runInBand --shard=${{ matrix.shard }}/2
          --passWithNoTests=false --json --outputFile="$RUNNER_TEMP/e2e-results.json"
      - name: Verify execution and report timings
        if: ${{ !cancelled() && steps.discovery.outcome == 'success' }}
        run: >-
          node scripts/e2e-shards.cjs report "$RUNNER_TEMP/e2e-discovery.json"
          ${{ matrix.shard }} "$RUNNER_TEMP/e2e-results.json"

  # Keep the required check name stable; skipped/cancelled shards cannot pass it.
  e2e-tests:
    name: e2e-tests
    needs: e2e-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require every E2E shard to succeed
        env:
          SHARDS_RESULT: ${{ needs.e2e-shards.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "E2E shards did not all succeed: $SHARDS_RESULT"
            exit 1
          fi
