name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        if: vars.ENABLE_GHAS_SECURITY_CHECKS == 'true'
        with:
          fail-on-severity: high
      - name: Report dependency review availability
        if: vars.ENABLE_GHAS_SECURITY_CHECKS != 'true'
        run: echo "Dependency Review is not enabled for this repository."

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        if: vars.ENABLE_GHAS_SECURITY_CHECKS == 'true'
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        if: vars.ENABLE_GHAS_SECURITY_CHECKS == 'true'
        with:
          category: /language:javascript-typescript
      - name: Report CodeQL availability
        if: vars.ENABLE_GHAS_SECURITY_CHECKS != 'true'
        run: echo "CodeQL is not enabled for this repository."
