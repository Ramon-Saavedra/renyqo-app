name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm audit --package-lock-only --omit=dev --audit-level=high

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        if: vars.ENABLE_GHAS_SECURITY_CHECKS == 'true'
        with:
          fail-on-severity: high
      - name: Report dependency review availability
        if: vars.ENABLE_GHAS_SECURITY_CHECKS != 'true'
        run: echo "Dependency Review is not enabled for this repository."

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        if: vars.ENABLE_GHAS_SECURITY_CHECKS == 'true'
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        if: vars.ENABLE_GHAS_SECURITY_CHECKS == 'true'
        with:
          category: /language:javascript-typescript
      - name: Report CodeQL availability
        if: vars.ENABLE_GHAS_SECURITY_CHECKS != 'true'
        run: echo "CodeQL is not enabled for this repository."
